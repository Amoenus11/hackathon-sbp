<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Syntropy</title>
<link rel="stylesheet" href="/static/css/base.css">
<script type="module" src="/static/js/entrar.js"></script>
</head>
<body class="acceso">
<main class="tarjeta">
  <div class="marca"><b>SYNTROPY</b></div>
  <h1>Analista IA</h1>
  <p class="lema">Del caos de datos al orden de las decisiones · Hackatón SBP–FISC</p>
  <form id="formulario" autocomplete="on">
    <div class="campo"><label for="usuario">Usuario</label>
      <input class="entrada" id="usuario" name="username" autocomplete="username" autocapitalize="none" required></div>
    <div class="campo"><label for="clave">Contraseña</label>
      <input class="entrada" id="clave" name="password" type="password" autocomplete="current-password" required></div>
    <p class="error" id="error" role="alert"></p>
    <button class="boton degradado grande" id="boton" type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
