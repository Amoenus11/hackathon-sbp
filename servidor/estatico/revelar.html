<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu contraseña · Syntropy</title>
<link rel="stylesheet" href="/estatico/css/base.css">
<script type="module" src="/estatico/js/revelar.js"></script>
</head>
<body class="acceso">
<main class="tarjeta">
  <div class="marca"><b>SYNTROPY</b></div>
  <h1>Tu contraseña</h1>
  <p class="lema">Se creó al azar y es muy fuerte. Este enlace la muestra <strong>una sola vez</strong>.</p>
  <div id="antes">
    <p class="aviso">Ten listo dónde guardarla (gestor de contraseñas). Al tocar el botón, el enlace deja de servir.</p>
    <p class="error" id="error" role="alert"></p>
    <button class="boton degradado grande" id="mostrar" type="button">Mostrar mi contraseña</button>
  </div>
  <div id="despues" class="oculto">
    <p>Usuario: <strong id="usuario"></strong></p>
    <div class="clave-grande" id="clave"></div>
    <div class="fila"><button class="boton" id="copiar" type="button">Copiar</button>
      <a class="boton secundario" href="/">Ir a la plataforma</a></div>
    <p class="nota">Guárdala ahora. Si la pierdes, pide al equipo Syntropy un enlace nuevo.</p>
  </div>
</main>
</body>
</html>
